# Supabase project configuration that is safe to push to the linked BitLink project.
# Keep Auth URLs explicit so production confirmation emails never fall back to localhost.
project_id = "BitLink"

[auth]
enabled = true
site_url = "https://bitlink.co.il"
additional_redirect_urls = [
  "https://bitlink.co.il/auth/callback",
  "https://www.bitlink.co.il/auth/callback",
  "https://bitlink.co.il/auth/confirm",
  "https://www.bitlink.co.il/auth/confirm",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  # Wildcard variants, added Sep 2026: GoTrue matches the FULL redirect URL
  # against this list, so a redirectTo carrying a query string (e.g.
  # /auth/callback?next=/reset-password, used by both the self-serve
  # "Forgot password" flow and the admin-triggered reset-link feature) never
  # matched the bare entries above. The mismatch fails silently — no error,
  # just a fallback to the bare site_url — so a customer clicking their reset
  # email landed on the homepage instead of /reset-password. These don't
  # replace the exact entries above; they just also allow the ?next=... form.
  "https://bitlink.co.il/auth/callback**",
  "https://www.bitlink.co.il/auth/callback**",
  "https://bitlink.co.il/auth/confirm**",
  "https://www.bitlink.co.il/auth/confirm**",
  "http://localhost:3000/auth/callback**",
  "http://localhost:3000/auth/confirm**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Custom SMTP, added Sep 2026. Supabase's built-in sender is rate-limited to a
# handful of messages per hour and sends unbranded mail from supabase.io — so
# password resets were silently failing to arrive once a few went out in a
# short window. This routes auth mail through the same Migadu mailbox the app
# already uses for transactional mail (see src/lib/email/send.ts).
#
# The password is NOT stored here. Set SUPABASE_AUTH_SMTP_PASSWORD in the
# environment before running `supabase config push`, or enter it once in
# Authentication → Emails → SMTP Settings in the dashboard.
[auth.email.smtp]
enabled = true
host = "smtp.migadu.com"
port = 587
user = "orders@bitlink.co.il"
pass = "env(SUPABASE_AUTH_SMTP_PASSWORD)"
admin_email = "orders@bitlink.co.il"
sender_name = "BitLink"

# Enabling custom SMTP does NOT lift the send limit on its own — it stays at
# the restrictive built-in default, which is the bug that made resets silently
# stop arriving. This is project-wide per hour; auth.email.max_frequency above
# is the separate per-user throttle (1 message/minute), which stays as it is.
# 100/hour is far above real demand here and still bounded, so a "forgot
# password" hammering can't burn the Migadu quota.
[auth.rate_limit]
email_sent = 100

# Branded auth email templates. Generated by `npm run emails:auth` — edit
# scripts/build-auth-emails.mjs, never the HTML files directly.
#
# Every link points at our own /auth/confirm with a token_hash, rather than
# using {{ .ConfirmationURL }}. Two reasons: the customer sees a bitlink.co.il
# URL instead of a <project>.supabase.co one, and verifyOtp works regardless of
# which device opens the email — the PKCE code exchange at /auth/callback needs
# the verifier cookie from the browser that started the flow, so requesting a
# reset on a phone and opening it on a laptop fails there.
[auth.email.template.confirmation]
subject = "Confirm your email to activate your BitLink account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You've been invited to BitLink"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your BitLink sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new BitLink email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.recovery]
subject = "Reset your BitLink password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "Your BitLink confirmation code"
content_path = "./supabase/templates/reauthentication.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# NOT DECLARED ON PURPOSE — do not uncomment without checking the live project.
#
# These were `supabase init` boilerplate (note the empty account_sid: Twilio has
# never been configured from this file), but the hosted project has Twilio
# ENABLED. Because `supabase config push` writes every property the file
# declares and leaves undeclared ones alone, restoring this block would turn
# production SMS off as a side effect of an unrelated push. Caught by
# `supabase config diff` in Sep 2026 while pushing the auth email templates.
#
# Supabase SMS is managed in the dashboard, not here. If that should change,
# reconcile against `supabase config diff` first.
#
# [auth.sms.twilio]
# enabled = false
# account_sid = ""
# message_service_sid = ""
# auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Local development only — the hosted project is unaffected by this block.
# BitLink does not use Supabase Storage (no `supabase.storage` call anywhere in
# src/), and CLI 2.117.0 ships a storage-api image tag that no longer resolves
# in any registry, which fails `supabase start` before the database is usable.
# Turning the service off locally lets the local stack come up for migration
# testing without pulling an image the project has no use for.
[storage]
enabled = false

# Also local-only. The analytics (Logflare) and vector containers are log
# plumbing for the local Studio UI; they report unhealthy on this machine and
# take the whole stack down with them on `supabase start`, including a database
# that had already migrated successfully. Nothing in BitLink reads them.
[analytics]
enabled = false
